<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Campus AI - Notification Settings</title>
<link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body>
<main>
<h1>Notification Settings</h1>

<form id="preferences">
<label>
<input type="checkbox" id="inApp">
In-app notifications
</label>

<label>
<input type="checkbox" id="email">
Email notifications
</label>

<label>
<input type="checkbox" id="push">
Push notifications
</label>

<hr>

<label>
<input type="checkbox" id="attendance">
Attendance alerts
</label>

<label>
<input type="checkbox" id="fees">
Fee alerts
</label>

<label>
<input type="checkbox" id="academic">
Academic alerts
</label>

<label>
<input type="checkbox" id="placement">
Placement alerts
</label>

<label>
<input type="checkbox" id="announcement">
Announcement alerts
</label>

<button type="submit">Save Preferences</button>
</form>

<p id="status"></p>
</main>

<script src="../../assets/js/notification-settings.js"></script>
</body>
</html>
