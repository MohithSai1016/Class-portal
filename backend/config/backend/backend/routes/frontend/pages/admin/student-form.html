<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Add Student</title>

<link rel="stylesheet"
href="../../assets/css/dashboard.css">

</head>

<body>

<h1>Add Student</h1>

<form id="studentForm">

<input
id="roll_number"
placeholder="Roll Number"
required>

<input
id="first_name"
placeholder="First Name"
required>

<input
id="last_name"
placeholder="Last Name">

<input
id="email"
type="email"
placeholder="Email">

<input
id="phone"
placeholder="Phone">

<input
id="semester"
type="number"
placeholder="Semester">

<input
id="section"
placeholder="Section">

<button type="submit">

Save Student

</button>

</form>

<script src="../../assets/js/student-form.js"></script>

</body>

</html>
