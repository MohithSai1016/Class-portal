<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">
<title>Smart Campus AI - Verify Certificate</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
    padding: 30px;
}
main {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 24px;
    border-radius: 10px;
}
input, button {
    padding: 10px;
}
input {
    width: 70%;
}
.valid {
    border-left: 5px solid #198754;
    padding: 14px;
    margin-top: 20px;
}
.invalid {
    border-left: 5px solid #dc3545;
    padding: 14px;
    margin-top: 20px;
}
</style>
</head>
<body>
<main>
<h1>Certificate Verification</h1>

<form id="verifyForm">
    <input
        id="code"
        placeholder="SCAI-XXXXXXXX"
        required>

    <button type="submit">
        Verify
    </button>
</form>

<section id="result"></section>
</main>

<script src="../../assets/js/verify-certificate-v2.js"></script>
</body>
</html>
