<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Campus AI - Announcement Manager</title>
<link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body>
<main>
<h1>Announcement Manager</h1>

<label>Title</label>
<input id="title">

<label>Message</label>
<textarea id="message"></textarea>

<label>Audience</label>
<select id="audience">
<option value="All">All</option>
<option value="Students">Students</option>
<option value="Faculty">Faculty</option>
<option value="HOD">HOD</option>
</select>

<label>Priority</label>
<select id="priority">
<option value="Low">Low</option>
<option value="Normal" selected>Normal</option>
<option value="High">High</option>
<option value="Urgent">Urgent</option>
</select>

<label>Expiry</label>
<input id="expiresAt" type="datetime-local">

<button id="publish">Publish Announcement</button>

<p id="status"></p>
</main>

<script src="../../assets/js/announcement-manager.js"></script>
</body>
</html>
